[package]
name = "lf-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "localflowd"
path = "src/bin/localflowd.rs"

[[bin]]
name = "localflowctl"
path = "src/bin/localflowctl.rs"

[dependencies]
lf-asr.workspace = true
lf-dictation = { path = "../lf-dictation" }
lf-io-api.workspace = true
lf-keyboard = { path = "../lf-keyboard" }
lf-media = { path = "../lf-media" }
lf-pipewire = { path = "../lf-pipewire" }
lf-portal = { path = "../lf-portal" }
lf-wayland = { path = "../lf-wayland" }
libc.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
# Session-bus client for the GlobalShortcuts portal (`trigger: "portal"`)
# and the tray icon (`localflowctl tray`); already used by lf-media.
# async-io, futures-lite and async-channel are zbus's own runtime crates (no
# new crates in the lock file).
zbus = "5"
async-channel = "2"
async-io = "2"
futures-lite = "2"

[dev-dependencies]
# FLAC decoding for the ignored real-model test (public LibriSpeech audio).
claxon = "0.4"

[[test]]
name = "private_dbus"
harness = false

[[test]]
name = "stalled_stderr"
harness = false
