[package]
name = "lf-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Bounded zbus calls and connections, shared with lf-media and lf-daemon.
lf-dbus = { path = "../lf-dbus" }
lf-io-api.workspace = true
lf-keyboard = { path = "../lf-keyboard" }
libc.workspace = true
# Pure-Rust libei client (the EIS protocol). Its dependencies (rustix,
# enumflags2, log) are already in the workspace.
reis = "0.7"
# Pure-Rust D-Bus, with its own runtime crates (no new crates).
zbus = "5"
async-io = "2"
futures-lite = "2"
