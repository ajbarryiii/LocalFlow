[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
lf-model = { path = "crates/lf-model" }
lf-cpu = { path = "crates/lf-cpu" }
lf-asr = { path = "crates/lf-asr" }
lf-io-api = { path = "crates/lf-io-api" }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
