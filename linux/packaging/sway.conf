# LocalFlow dictation binds for sway (checked against sway 1.12). Not
# installed automatically; copy into your sway config, or `include` this
# file from it, then `swaymsg reload`.
#
# Pick a key nothing else uses: F13-F24, a spare macro or thumb key, Pause,
# ... To find its code, run `wev`, press the key and read the key event:
#   key: 191; state: 1 (pressed)
#                      sym: XF86Tools
# `bindcode` takes that number. The examples use 191, the F13 key (evdev
# KEY_F13); with the default xkb rules it produces the XF86Tools keysym
# rather than F13, which is why a code is used. `bindsym XF86Tools ...`
# works too.

# Hold to talk: press starts recording, release stops and types the text.
# Double-tap and hold dictates a prompt (Hold to Prompt). --no-repeat: the
# press runs once per hold, not on every key repeat.
bindcode --no-repeat 191 exec localflowctl press
bindcode --release 191 exec localflowctl release

# Teach the custom dictionary from a correction of the last dictation (within
# two minutes of typing it): rofi opens with its text; edit it and press
# Return. The text already typed in the other app is not changed. Needs rofi.
bindsym Mod4+Shift+d exec localflowctl correct

# The release bind is dropped if any other key, a modifier key included, is
# pressed while the dictation key is held (sway has nothing like Hyprland's
# `i` flag). The recording then keeps running: tap the dictation key again to
# stop it (or `localflowctl cancel`); it also stops by itself at
# `max_recording_seconds`.
#
# Modifiers and LocalFlow's typing: sway matches binds against the modifiers
# of the keyboard that sent the key, and LocalFlow types through a virtual
# keyboard of its own that never holds a modifier, so text typed while you
# hold Super does not trigger your Super binds. Apps should not see your held
# modifiers with it either (sway sends each keyboard's own modifier state);
# that part is from sway's source (sway/input/keyboard.c), not tested. The
# bind behaviour above was checked in a private headless sway 1.12 with
# virtual keyboards (wtype) standing in for real ones.
#
# sway has no per-device switch like Hyprland's `keybinds = false`;
# `--input-device` only limits a bind to one device. Do not bind anything that
# types (such as `localflowctl again`) to a modifier combination.
