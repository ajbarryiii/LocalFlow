# LocalFlow dictation binds for Hyprland. Not installed automatically;
# copy into your Hyprland config, or `source` this file from it.
#
# F13 is the remapped Kinesis thumb key. With the default xkb rules the F13
# key (evdev KEY_F13, xkb keycode 191) often produces the XF86Tools keysym
# rather than F13, so the binds use the keycode. Check with `wev` and press
# the key: look for "key: 191".

# Hold to talk: press starts recording, release stops and types the text.
bind = , code:191, exec, localflowctl press
# `i` ignores modifiers, so the release still arrives when Shift or another
# modifier is held as F13 comes up.
bindri = , code:191, exec, localflowctl release

# Teach the custom dictionary from a correction of the last dictation (within
# two minutes of typing it): rofi opens with its text; edit it and press
# Return. The text already typed in the other app is not changed. Needs rofi.
bind = SUPER SHIFT, D, exec, localflowctl correct

# LocalFlow types through a Wayland virtual keyboard, and Hyprland matches its
# binds against the modifiers held on every keyboard: text typed while Super is
# held would trigger Hyprland binds. This stops LocalFlow's keyboard from
# triggering any Hyprland bind; restart localflowd after adding it. See
# "Hyprland" under "Text output and desktops" in linux/README.md.
device {
    name = hl-virtual-keyboard-localflowd
    keybinds = false
}

# Apps still see modifiers held on the physical keyboard, so release modifiers
# before releasing F13, and do not bind anything that types (such as
# `localflowctl again`) to a modifier combination.
