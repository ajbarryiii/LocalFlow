# LocalFlow dictation binds for Hyprland. Not installed automatically;
# copy into your Hyprland config, or `source` this file from it.
#
# Pick a key nothing else uses: F13-F24, a spare macro or thumb key, Pause,
# ... To find its code, run `wev`, press the key and read the key event:
#   key: 191; state: 1 (pressed)
#                      sym: XF86Tools
# `code:` takes that number. The examples use 191, the F13 key (evdev
# KEY_F13), for instance a remapped thumb key. With the default xkb rules it
# produces the XF86Tools keysym rather than F13, which is why a code is used.

# Hold to talk: press starts recording, release stops and types the text.
# Double-tap and hold dictates a prompt (Hold to Prompt).
bind = , code:191, exec, localflowctl press
# `i` ignores modifiers, so the release still arrives when Shift or another
# modifier is held as the key comes up.
bindri = , code:191, exec, localflowctl release

# Or tap to toggle (tap to start, tap again to stop) instead of holding:
# bind = , code:191, exec, localflowctl toggle

# The binds above are the recommended way on Hyprland. Alternatively, with
# `"trigger": "portal"` in LocalFlow's config.json and
# xdg-desktop-portal-hyprland running, the daemon registers global shortcuts
# that Hyprland binds with `global`, which passes both press and release.
# `hyprctl globalshortcuts` lists their names. `i` ignores modifiers, so the
# release still arrives when a modifier is held as the key comes up (without
# it Hyprland drops that release); the press then also fires with modifiers
# held. Use one way or the other, not both:
# bindi = , code:191, global, com.ajbarryiii.localflow:hold-to-talk
# bind = , code:192, global, com.ajbarryiii.localflow:toggle

# Teach the custom dictionary from a correction of the last dictation (within
# two minutes of typing it): rofi opens with its text; edit it and press
# Return. The text already typed in the other app is not changed. Needs rofi.
bind = SUPER SHIFT, D, exec, localflowctl correct

# LocalFlow types through a Wayland virtual keyboard, and Hyprland matches its
# binds against the modifiers held on every keyboard. Without this, text typed
# while Super is held would trigger Hyprland binds (Super+Q closes the window,
# Super+M exits Hyprland). This stops LocalFlow's keyboard from triggering any
# Hyprland bind. The device name is "hl-virtual-keyboard-" plus the daemon's
# process name; it applies when the daemon connects, so restart localflowd
# after adding it.
device {
    name = hl-virtual-keyboard-localflowd
    keybinds = false
}

# Apps still see modifiers held on the physical keyboard (Hyprland always
# shares a physical keyboard's modifiers; `input:virtualkeyboard:share_states`
# does not change that), so text typed while Ctrl is held reaches the focused
# app as Ctrl shortcuts. Release modifiers before releasing the dictation key.
# For the same reason, do not bind `localflowctl again` (or anything else that
# types) to a modifier combination: the text would be typed while the modifier
# is held.
